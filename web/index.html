<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strata</title>
    <meta name="theme-color" content="#1f5f52" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --paper: #f4f3ee;
        --card: #ffffff;
        --ink: #1c2321;
        --muted: #6b736e;
        --line: #e2e0d8;
        --accent: #1f5f52;
        --accent-ink: #174a40;
        --accent-soft: #e4efea;
      }
      html { background: var(--paper); scrollbar-gutter: stable; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
      .display { font-family: Fraunces, Georgia, "Iowan Old Style", serif; font-weight: 600; letter-spacing: -0.01em; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(28, 35, 33, 0.04), 0 12px 28px -24px rgba(28, 35, 33, 0.35); }
      .btn-primary { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--accent); color: #fff; border-radius: 9px; padding: 0.55rem 1rem; font-size: 0.875rem; font-weight: 600; white-space: nowrap; transition: background 0.15s, transform 0.05s; }
      .btn-primary:hover { background: var(--accent-ink); }
      .btn-primary:active { transform: translateY(1px); }
      .btn-primary:disabled { opacity: 0.6; }
      .input { border: 1px solid var(--line); border-radius: 9px; padding: 0.5rem 0.75rem; font-size: 0.875rem; background: #fff; color: var(--ink); min-height: 2.5rem; }
      .input::placeholder { color: #9aa19c; }
      .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .input.file { padding: 0.3rem 0.35rem; color: var(--muted); }
      .input.file::file-selector-button { font: inherit; font-size: 0.8rem; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); border: 0; border-radius: 6px; padding: 0.35rem 0.75rem; margin-right: 0.75rem; cursor: pointer; }
      .input.file::file-selector-button:hover { background: #d7e7e0; }
      .link { color: var(--accent-ink); text-decoration: underline; text-decoration-color: rgba(31, 95, 82, 0.35); text-underline-offset: 3px; }
      .link:hover { text-decoration-color: var(--accent-ink); }
      .link-quiet { color: var(--accent-ink); }
      .link-quiet:hover { text-decoration: underline; text-underline-offset: 3px; }
      .chip { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
      .chip-ok { background: #e4efea; color: #1f5f52; }
      .chip-rec { background: #e6ecf5; color: #2e4a78; }
      .chip-past { background: #ecebe5; color: #5f665f; }
      .chip-bad { background: #f9e6e2; color: #a23b2c; }
      .chip-warn { background: #f8efd8; color: #886311; }
      .quote { border-left: 3px solid var(--line); padding-left: 12px; color: #4a534f; }
      a.nav { color: var(--muted); padding-bottom: 6px; border-bottom: 2px solid transparent; font-weight: 500; transition: color 0.15s; }
      a.nav:hover { color: var(--ink); }
      a.nav.active { color: var(--accent-ink); border-bottom-color: var(--accent); }
      .scroll { scrollbar-width: thin; scrollbar-color: #cfd2cb transparent; scrollbar-gutter: stable; padding-right: 14px; }
      .scroll::-webkit-scrollbar { width: 8px; }
      .scroll::-webkit-scrollbar-thumb { background: #d3d6cf; border-radius: 8px; }
      .scroll::-webkit-scrollbar-track { background: transparent; }
      thead th { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; white-space: nowrap; }
      tbody tr { border-top: 1px solid var(--line); }
      .row-hover { transition: background 0.12s; }
      .row-hover:hover { background: #faf9f5; }
      .hairline { border-color: var(--line); }
      .scroll-area { overflow: auto; max-height: 70vh; scrollbar-width: thin; scrollbar-color: #cfd2cb transparent; scrollbar-gutter: stable; padding-right: 10px; }
      .scroll-area::-webkit-scrollbar { width: 8px; height: 8px; }
      .scroll-area::-webkit-scrollbar-thumb { background: #d3d6cf; border-radius: 8px; }
      .scroll-area thead th { position: sticky; top: 0; z-index: 1; background: var(--card); }
      .spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; vertical-align: -0.15em; animation: spin 0.6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      button:disabled { cursor: progress; }
      .modal-panel { background: var(--card); border-radius: 16px; box-shadow: 0 30px 80px -30px rgba(28, 35, 33, 0.6); }
    </style>
  </head>
  <body class="text-stone-900">
    <header class="border-b hairline bg-white/80 backdrop-blur">
      <div class="mx-auto flex max-w-7xl items-center gap-8 px-6 py-4">
        <a href="#documents" class="flex items-center gap-3">
          <img src="/favicon.svg" alt="" class="h-7 w-7 rounded-lg" />
          <span class="display text-2xl text-stone-900">Strata</span>
        </a>
        <nav class="flex gap-6 text-sm">
          <a class="nav" href="#documents">Documents</a>
          <a class="nav" href="#facts">Facts</a>
          <a class="nav" href="#relations">Relations</a>
          <a class="nav" href="#quarantine">Quarantine</a>
          <a class="nav" href="#answer">Answer</a>
        </nav>
        <span id="health" class="ml-auto mono text-xs text-stone-500"></span>
      </div>
    </header>
    <main id="view" class="mx-auto max-w-7xl px-6 py-8"></main>
    <div id="modal" class="fixed inset-0 z-20 hidden overflow-y-auto bg-stone-900/50 p-6 backdrop-blur-sm" onclick="if (event.target === this) closeModal()">
      <div id="modal-body" class="modal-panel mx-auto max-w-6xl p-6"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
