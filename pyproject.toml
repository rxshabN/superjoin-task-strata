[project]
name = "strata"
version = "0.1.0"
description = "A fact knowledge layer that treats every fact as a dated, scoped, grounded claim."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "pymupdf>=1.28.2",
    "google-genai>=2.22.0",
    "libsql>=0.1.11",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.38.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strata"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
